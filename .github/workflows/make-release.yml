name: Create Release

on:
  push:
    tags:
      - 'v*'

env:
    ARTIFACT_NAME: CubePrinterPlugin.zip
    RELEASE_DIR: RELEASE
    RELEASE_PATH: RELEASE/CubePrinterPlugin.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tools/requirements.txt
        
    - name: Set package version
      uses: RadovanPelka/github-action-json@v1.0.2
      with:
        path: "resources/package.json"
        replaceWith: |
          {
            "version": "${{ github.ref_name }}"
          }
        
    - name: Set plugins/Cube3Writer version
      uses: RadovanPelka/github-action-json@v1.0.2
      with:
        path: "plugins/Cube3Writer/plugin.json"
        replaceWith: |
          {
            "version": "${{ github.ref_name }}"
          }
        
    - name: Set plugins/CubePrinterPlugin version
      uses: RadovanPelka/github-action-json@v1.0.2
      with:
        path: "plugins/CubePrinterPlugin/plugin.json"
        replaceWith: |
          {
            "version": "${{ github.ref_name }}"
          }
        
    - name: Set plugins/CubeproWriter version
      uses: RadovanPelka/github-action-json@v1.0.2
      with:
        path: "plugins/CubeproWriter/plugin.json"
        replaceWith: |
          {
            "version": "${{ github.ref_name }}"
          }
        
    - name: Set plugins/CubeWriter version
      uses: RadovanPelka/github-action-json@v1.0.2
      with:
        path: "plugins/CubeWriter/plugin.json"
        replaceWith: |
          {
            "version": "${{ github.ref_name }}"
          }
        
    - name: Set plugins/CubexWriter version
      uses: RadovanPelka/github-action-json@v1.0.2
      with:
        path: "plugins/CubexWriter/plugin.json"
        replaceWith: |
          {
            "version": "${{ github.ref_name }}"
          }

    - name: Execute make_release.py
      run: python tools/make_release.py
      
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.RELEASE_DIR }}/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.RELEASE_DIR }}

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          ${{ env.RELEASE_DIR }}/*